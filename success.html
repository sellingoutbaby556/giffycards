<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order confirmed — giffycardsLLC</title>
<style>
  :root{--bg:#f6f4ef;--surface:#fff;--fg:#1c1a17;--muted:#6b655c;--line:#e2ddd2;--accent:#0f6b4f;--accent-ink:#fff;
    --display:"Fraunces",Georgia,serif;--body:"Public Sans",system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#141310;--surface:#1e1c18;--fg:#f3efe7;--muted:#a69f92;--line:#322e27;--accent:#43b58b;--accent-ink:#10130f;color-scheme:dark}}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);min-height:100vh;display:grid;place-items:center;padding:24px}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:40px 32px;max-width:460px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
  .tick{width:60px;height:60px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:32px;margin:0 auto 18px;animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  h1{font-family:var(--display);font-weight:580;font-size:26px;margin:0 0 10px}
  p{color:var(--muted);line-height:1.55;margin:0 0 8px}
  .oid{font-family:var(--mono);font-size:13px;background:rgba(127,127,127,.12);padding:3px 8px;border-radius:6px;color:var(--fg)}
  a.btn{display:inline-block;margin-top:22px;font-weight:600;text-decoration:none;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:11px}
</style>
</head>
<body>
  <div class="box">
    <div class="tick">✓</div>
    <h1>Payment received</h1>
    <p>Thanks for your order. A receipt has been sent to your email.</p>
    <p>Your card codes will be delivered shortly after we confirm the order.</p>
    <p style="margin-top:14px">Order reference<br><span class="oid" id="oid">—</span></p>
    <a class="btn" href="/">Back to the shop</a>
  </div>
<script>
  var id=new URLSearchParams(location.search).get("session_id");
  if(id)document.getElementById("oid").textContent=id;
</script>
</body>
</html>
